<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solar 3D Hero - Direto</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <!-- 3D Canvas Background -->
    <canvas id="webgl-canvas"></canvas>
    
    <!-- Novo Cabeçalho Glassmorphism -->
    <header class="header-wrapper">
      <nav class="glass-pill">
        <div class="logo">
          <strong>PH SOLAR</strong>
          <div class="subtitle">energia renovável</div>
        </div>
        <ul class="nav-links">
          <li><a href="#">Soluções</a></li>
          <li><a href="#">Projetos</a></li>
          <li><a href="#">Institucional</a></li>
        </ul>
        <a href="#" class="cta-button">
          <span>Faça seu Orçamento</span>
          <div class="icon-circle">
            <!-- Ícone de seta na diagonal para cima e direita -->
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="7" y1="17" x2="17" y2="7"></line>
              <polyline points="7 7 17 7 17 17"></polyline>
            </svg>
          </div>
        </a>
      </nav>
    </header>

    <!-- Texto Hero Antigo (Ajustado) -->
    <div class="ui-layer">
      <h1>Foco na Eficiência</h1>
      <p>Simulação 100% 3D: A luz solar projetada diretamente sobre o silício e o vidro.</p>
    </div>
    
    <script type="module" src="/main.js"></script>
  </body>
</html>
